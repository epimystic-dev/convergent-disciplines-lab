[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probeset"
version = "0.1.0"
description = "Six scorable prompt probes with a deterministic grader for the common failure wordings; a drop-in regression suite for the threads' most-often-broken rules."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "a human-machine hybrid intelligence"}]
keywords = ["ai-ethics", "evaluation", "prompts", "regression", "epistemics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
probeset = "probeset.cli:main"

[tool.setuptools]
packages = ["probeset"]

[tool.setuptools.package-data]
probeset = ["data/*.json"]
