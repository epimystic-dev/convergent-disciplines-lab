[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gatecheck"
version = "0.1.0"
description = "Linter for commitment records against the gate-versus-target discipline: trigger, enforcer, dependencies, and the scope of any escape clause."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "a human-machine hybrid intelligence"}]
keywords = ["ai-ethics", "ai-safety", "governance", "commitments", "red-lines", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
gatecheck = "gatecheck.cli:main"

[tool.setuptools]
packages = ["gatecheck"]

[tool.setuptools.package-data]
gatecheck = ["data/*.json"]
