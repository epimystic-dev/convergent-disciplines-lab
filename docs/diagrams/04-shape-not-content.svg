<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Shape, not content</title>
<desc id="d">The anti-Capra discipline: a convergence claims only a shared shape; each tradition keeps its own content and vocabulary; flattening the contents into one gloss withdraws the claim.</desc>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3567c8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6639ba"/></marker></defs>
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="22.0" fill="#1f2328" text-anchor="start" font-weight="700">Agree on shape, keep content plural: the anti-Capra discipline (M3, D5)</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#57606a" text-anchor="start">The agreement carries weight because the contents cannot be reduced to one another. Flatten them and the agreement has been written into the translation.</text>
<rect x="430.0" y="250.0" width="340.0" height="110.0" rx="6" fill="#24292f" stroke="#24292f" stroke-width="1.2"/>
<text x="600.0" y="290.0" font-size="16.0" fill="#ffffff" text-anchor="middle" font-weight="700">Shared shape</text>
<text x="450.0" y="316.0" font-size="13.5" fill="#d0d7de" text-anchor="start">relation comes before substance</text>
<rect x="60.0" y="120.0" width="320.0" height="110.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="72.0" y="142.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Relational quantum mechanics</text>
<text x="72.0" y="160.9" font-size="11.5" fill="#57606a" text-anchor="start">properties exist only relative to interacting</text>
<text x="72.0" y="175.8" font-size="11.5" fill="#57606a" text-anchor="start">systems; says nothing about liberation</text>
<rect x="820.0" y="120.0" width="320.0" height="110.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="832.0" y="142.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Madhyamaka</text>
<text x="832.0" y="160.9" font-size="11.5" fill="#57606a" text-anchor="start">phenomena are empty of inherent existence; a path</text>
<text x="832.0" y="175.8" font-size="11.5" fill="#57606a" text-anchor="start">out of suffering, not a physical theory</text>
<rect x="60.0" y="400.0" width="320.0" height="110.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="72.0" y="422.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Hua-yen Indra's Net</text>
<text x="72.0" y="440.9" font-size="11.5" fill="#57606a" text-anchor="start">phenomena interpenetrate without obstruction; a</text>
<text x="72.0" y="455.8" font-size="11.5" fill="#57606a" text-anchor="start">Tang synthesis, not generic connectedness</text>
<rect x="820.0" y="400.0" width="320.0" height="110.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="832.0" y="422.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Anishinaabe kinship</text>
<text x="832.0" y="440.9" font-size="11.5" fill="#57606a" text-anchor="start">the river is a relative within a moral community</text>
<text x="832.0" y="455.8" font-size="11.5" fill="#57606a" text-anchor="start">grounded in place</text>
<line x1="380.0" y1="175.0" x2="480.0" y2="252.0" stroke="#3567c8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<line x1="820.0" y1="175.0" x2="720.0" y2="252.0" stroke="#3567c8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<line x1="380.0" y1="455.0" x2="480.0" y2="358.0" stroke="#3567c8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<line x1="820.0" y1="455.0" x2="720.0" y2="358.0" stroke="#3567c8" stroke-width="1.4" marker-end="url(#a-blue)"/>
<text x="600.0" y="210.0" font-size="12.0" fill="#3567c8" text-anchor="middle">each route arrives by its own method</text>
<text x="600.0" y="400.0" font-size="12.0" fill="#3567c8" text-anchor="middle">the contents stay where they are</text>
<rect x="60.0" y="548.0" width="1080.0" height="70.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="76.0" y="572.0" font-size="13.5" fill="#b42318" text-anchor="start" font-weight="700">Flattened (withdrawn): &quot;physics and mysticism are the same: all is one&quot;</text>
<text x="76.0" y="594.0" font-size="12.0" fill="#1f2328" text-anchor="start">identity phrasing (CON-003) and duplicated content (CON-002) withdraw the claim until each route's own content is restored.</text>
</svg>
