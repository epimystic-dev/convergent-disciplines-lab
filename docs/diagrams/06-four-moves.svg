<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The four-move framework</title>
<desc id="d">Two truths, action without attachment, Indra's Net and political economy, each from its own tradition and mapped to a pressure, held together; any one alone fails in a characteristic way.</desc>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3567c8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6639ba"/></marker></defs>
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="22.0" fill="#1f2328" text-anchor="start" font-weight="700">The four moves, held together (F1-F5; the author's own thesis, CV9)</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#57606a" text-anchor="start">Habits of thought to inhabit, not a checklist. Each is grounded in a separate tradition and can be used without its metaphysics; the claim is about integration.</text>
<rect x="60.0" y="120.0" width="500.0" height="200.0" rx="6" fill="#f3eefc" stroke="#6639ba" stroke-width="1.2"/>
<text x="78.0" y="152.0" font-size="18.0" fill="#6639ba" text-anchor="start" font-weight="700">Two truths</text>
<text x="78.0" y="178.0" font-size="12.0" fill="#57606a" text-anchor="start">From: Madhyamaka (Nagarjuna, Mulamadhyamakakarika ch. 24, generalised)</text>
<text x="78.0" y="228.0" font-size="13.0" fill="#1f2328" text-anchor="start">Act firmly on what holds in practice while keeping the foundational</text>
<text x="78.0" y="244.9" font-size="13.0" fill="#1f2328" text-anchor="start">question open; refuse collapse to either level.</text>
<text x="78.0" y="304.0" font-size="12.0" fill="#6639ba" text-anchor="start">answers the pressure of planetary boundaries</text>
<rect x="640.0" y="120.0" width="500.0" height="200.0" rx="6" fill="#f3eefc" stroke="#6639ba" stroke-width="1.2"/>
<text x="658.0" y="152.0" font-size="18.0" fill="#6639ba" text-anchor="start" font-weight="700">Niskama karma</text>
<text x="658.0" y="178.0" font-size="12.0" fill="#57606a" text-anchor="start">From: Bhagavad Gita 2.47 with Shankara's commentary, generalised through</text>
<text x="658.0" y="193.6" font-size="12.0" fill="#57606a" text-anchor="start">Daya Krishna</text>
<text x="658.0" y="228.0" font-size="13.0" fill="#1f2328" text-anchor="start">Full competence over the act, no claim on its fruit, and no retreat</text>
<text x="658.0" y="244.9" font-size="13.0" fill="#1f2328" text-anchor="start">into inaction.</text>
<text x="658.0" y="304.0" font-size="12.0" fill="#6639ba" text-anchor="start">answers the pressure of value uncertainty in AI</text>
<rect x="640.0" y="400.0" width="500.0" height="200.0" rx="6" fill="#f3eefc" stroke="#6639ba" stroke-width="1.2"/>
<text x="658.0" y="432.0" font-size="18.0" fill="#6639ba" text-anchor="start" font-weight="700">Indra's Net</text>
<text x="658.0" y="458.0" font-size="12.0" fill="#57606a" text-anchor="start">From: Hua-yen shishi wu'ai (Fazang)</text>
<text x="658.0" y="508.0" font-size="13.0" fill="#1f2328" text-anchor="start">The pattern of relations is the unit; there is no standpoint outside</text>
<text x="658.0" y="524.9" font-size="13.0" fill="#1f2328" text-anchor="start">it.</text>
<text x="658.0" y="584.0" font-size="12.0" fill="#6639ba" text-anchor="start">answers the pressure of the relational convergence</text>
<rect x="60.0" y="400.0" width="500.0" height="200.0" rx="6" fill="#f3eefc" stroke="#6639ba" stroke-width="1.2"/>
<text x="78.0" y="432.0" font-size="18.0" fill="#6639ba" text-anchor="start" font-weight="700">Political economy after structural-demographic theory</text>
<text x="78.0" y="458.0" font-size="12.0" fill="#57606a" text-anchor="start">From: Turchin, generalised through Piketty, Scheidel, Polanyi, Acemoglu</text>
<text x="78.0" y="473.6" font-size="12.0" fill="#57606a" text-anchor="start">and Robinson, Mazzucato, Graeber and Wengrow</text>
<text x="78.0" y="508.0" font-size="13.0" fill="#1f2328" text-anchor="start">Ask who gains, who pays, and whether the freedoms to move away,</text>
<text x="78.0" y="524.9" font-size="13.0" fill="#1f2328" text-anchor="start">disobey and reshape are kept.</text>
<text x="78.0" y="584.0" font-size="12.0" fill="#6639ba" text-anchor="start">answers the pressure of the political-economy crisis</text>
<rect x="470.0" y="315.0" width="260.0" height="80.0" rx="6" fill="#24292f" stroke="#24292f" stroke-width="1.2"/>
<text x="600.0" y="348.0" font-size="15.0" fill="#ffffff" text-anchor="middle" font-weight="700">one stance</text>
<text x="600.0" y="372.0" font-size="12.5" fill="#d0d7de" text-anchor="middle">inhabited, not scored</text>
<rect x="60.0" y="616.0" width="1080.0" height="70.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="76.0" y="640.0" font-size="13.5" fill="#b42318" text-anchor="start" font-weight="700">Each move alone fails</text>
<text x="76.0" y="662.0" font-size="11.5" fill="#1f2328" text-anchor="start">two truths without political economy drifts into refinement on unjust ground; political economy without two truths collapses into materialist reductionism; niskama karma</text>
<text x="76.0" y="677.0" font-size="11.5" fill="#1f2328" text-anchor="start">without Indra's Net becomes a private practice; Indra's Net without niskama karma becomes contemplative ornament with no agency inside the web.</text>
</svg>
