<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Cooperation's infrastructure</title>
<desc id="d">The three layers cooperation runs on, the eight capacities an AI deployment can support or erode, the reciprocity policy for agents, and the freedoms a deployment must keep.</desc>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3567c8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6639ba"/></marker></defs>
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="22.0" fill="#1f2328" text-anchor="start" font-weight="700">What a deployment touches: cooperation's infrastructure (K1-K8, D7, A10)</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#57606a" text-anchor="start">Judge a deployment less by whether its output is correct than by whether it strengthens or erodes what people need to cooperate, and whether they can still leave,</text>
<text x="28.0" y="81.5" font-size="13.5" fill="#57606a" text-anchor="start">contest and reshape it.</text>
<rect x="40.0" y="120.0" width="520.0" height="68.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="58.0" y="148.0" font-size="15.0" fill="#3567c8" text-anchor="start" font-weight="700">narrative layer</text>
<text x="58.0" y="170.0" font-size="12.5" fill="#1f2328" text-anchor="start">shared stories that motivate taking part</text>
<rect x="40.0" y="198.0" width="520.0" height="68.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="58.0" y="226.0" font-size="15.0" fill="#3567c8" text-anchor="start" font-weight="700">institutional layer</text>
<text x="58.0" y="248.0" font-size="12.5" fill="#1f2328" text-anchor="start">rules with legitimacy, enforcement, competence and responsiveness</text>
<rect x="40.0" y="276.0" width="520.0" height="68.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="58.0" y="304.0" font-size="15.0" fill="#3567c8" text-anchor="start" font-weight="700">cognitive layer</text>
<text x="58.0" y="326.0" font-size="12.5" fill="#1f2328" text-anchor="start">shared concepts, standards and reference points</text>
<text x="600.0" y="136.0" font-size="15.0" fill="#1f2328" text-anchor="start" font-weight="700">The eight capacities (D7)</text>
<rect x="600.0" y="150.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="616.0" y="173.0" font-size="12.5" fill="#1f2328" text-anchor="start">sustained attention</text>
<rect x="880.0" y="150.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="896.0" y="173.0" font-size="12.5" fill="#1f2328" text-anchor="start">embodied grounding</text>
<rect x="600.0" y="194.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="616.0" y="217.0" font-size="12.5" fill="#1f2328" text-anchor="start">cultural inheritance</text>
<rect x="880.0" y="194.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="896.0" y="217.0" font-size="12.5" fill="#1f2328" text-anchor="start">communicative competence</text>
<rect x="600.0" y="238.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="616.0" y="261.0" font-size="12.5" fill="#1f2328" text-anchor="start">critical thinking</text>
<rect x="880.0" y="238.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="896.0" y="261.0" font-size="12.5" fill="#1f2328" text-anchor="start">exposure to other traditions</text>
<rect x="600.0" y="282.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="616.0" y="305.0" font-size="12.5" fill="#1f2328" text-anchor="start">integration</text>
<rect x="880.0" y="282.0" width="266.0" height="36.0" rx="18" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="896.0" y="305.0" font-size="12.5" fill="#1f2328" text-anchor="start">cultivation practices</text>
<text x="40.0" y="390.0" font-size="15.0" fill="#1f2328" text-anchor="start" font-weight="700">A legible reciprocity policy for agents (K1)</text>
<rect x="40.0" y="404.0" width="266.0" height="76.0" rx="6" fill="#fff8e1" stroke="#9a6700" stroke-width="1.2"/>
<text x="52.0" y="426.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">nice</text>
<text x="52.0" y="444.9" font-size="11.5" fill="#57606a" text-anchor="start">cooperate on first contact</text>
<rect x="320.0" y="404.0" width="266.0" height="76.0" rx="6" fill="#fff8e1" stroke="#9a6700" stroke-width="1.2"/>
<text x="332.0" y="426.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">forgiving</text>
<text x="332.0" y="444.9" font-size="11.5" fill="#57606a" text-anchor="start">restore trust after one response</text>
<rect x="600.0" y="404.0" width="266.0" height="76.0" rx="6" fill="#fff8e1" stroke="#9a6700" stroke-width="1.2"/>
<text x="612.0" y="426.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">provokable</text>
<text x="612.0" y="444.9" font-size="11.5" fill="#57606a" text-anchor="start">answer every violation</text>
<rect x="880.0" y="404.0" width="266.0" height="76.0" rx="6" fill="#fff8e1" stroke="#9a6700" stroke-width="1.2"/>
<text x="892.0" y="426.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">clear</text>
<text x="892.0" y="444.9" font-size="11.5" fill="#57606a" text-anchor="start">publish the policy; log violations</text>
<text x="40.0" y="520.0" font-size="15.0" fill="#1f2328" text-anchor="start" font-weight="700">The three freedoms (A10)</text>
<rect x="40.0" y="534.0" width="360.0" height="90.0" rx="6" fill="#f3eefc" stroke="#6639ba" stroke-width="1.2"/>
<text x="52.0" y="556.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">to move away</text>
<text x="52.0" y="574.9" font-size="11.5" fill="#57606a" text-anchor="start">a right to opt out, data portability, non-algorithmic</text>
<text x="52.0" y="589.9" font-size="11.5" fill="#57606a" text-anchor="start">alternatives for essential services</text>
<rect x="414.0" y="534.0" width="360.0" height="90.0" rx="6" fill="#f3eefc" stroke="#6639ba" stroke-width="1.2"/>
<text x="426.0" y="556.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">to disobey</text>
<text x="426.0" y="574.9" font-size="11.5" fill="#57606a" text-anchor="start">contestability, appeal and due process for AI decisions</text>
<rect x="788.0" y="534.0" width="360.0" height="90.0" rx="6" fill="#f3eefc" stroke="#6639ba" stroke-width="1.2"/>
<text x="800.0" y="556.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">to reshape</text>
<text x="800.0" y="574.9" font-size="11.5" fill="#57606a" text-anchor="start">public participation, audit rights, a say over</text>
<text x="800.0" y="589.9" font-size="11.5" fill="#57606a" text-anchor="start">deployment</text>
<text x="40.0" y="660.0" font-size="12.0" fill="#57606a" text-anchor="start">threadkit review scores each section (supports / neutral / erodes / unknown) and flags erosion, closed freedoms, unaudited shared media and an empty political economy. A review is</text>
<text x="40.0" y="675.6" font-size="12.0" fill="#57606a" text-anchor="start">a prompt for judgement, never a score.</text>
</svg>
