<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="1200" height="1150" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What an AI system gains</title>
<desc id="d">Fifteen failure modes of AI reasoning, the lessons that address each, and what changes when they are implemented.</desc>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3567c8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6639ba"/></marker></defs>
<rect x="0" y="0" width="1200" height="1150" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="22.0" fill="#1f2328" text-anchor="start" font-weight="700">What an AI system gains: failure mode, lesson, what changes</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#57606a" text-anchor="start">Each gain is a bet with a test in threads.json, not a guarantee. If the test fails, the lesson is revised or retired (P2).</text>
<text x="28.0" y="128.0" font-size="13.0" fill="#57606a" text-anchor="start" font-weight="700">Failure mode</text>
<text x="470.0" y="128.0" font-size="13.0" fill="#57606a" text-anchor="start" font-weight="700">Lessons</text>
<text x="600.0" y="128.0" font-size="13.0" fill="#57606a" text-anchor="start" font-weight="700">What changes</text>
<rect x="28.0" y="140.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="162.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Every sentence in one confident register</text>
<rect x="470.0" y="150.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="172.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">M1</text>
<line x1="448.0" y1="167.0" x2="466.0" y2="167.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="167.0" x2="596.0" y2="167.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="140.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="162.0" font-size="12.5" fill="#1f2328" text-anchor="start">each claim's standing is visible; proof language is refused on contested claims</text>
<rect x="28.0" y="202.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="224.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Many sources repeating one, counted as consensus</text>
<rect x="470.0" y="212.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="234.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">M2, A5</text>
<line x1="448.0" y1="229.0" x2="466.0" y2="229.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="229.0" x2="596.0" y2="229.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="202.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="224.0" font-size="12.5" fill="#1f2328" text-anchor="start">agreement is counted by independent routes; copies of one model are one witness</text>
<rect x="28.0" y="264.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="286.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">'All traditions teach the same thing'</text>
<rect x="470.0" y="274.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="296.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">M3, D5</text>
<line x1="448.0" y1="291.0" x2="466.0" y2="291.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="291.0" x2="596.0" y2="291.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="264.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="286.0" font-size="12.5" fill="#1f2328" text-anchor="start">the shared shape is stated and each tradition keeps its own terms and content</text>
<rect x="28.0" y="326.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="348.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Live disputes settled by fiat or averaged away</text>
<rect x="470.0" y="336.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="358.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">M4</text>
<line x1="448.0" y1="353.0" x2="466.0" y2="353.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="353.0" x2="596.0" y2="353.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="326.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="348.0" font-size="12.5" fill="#1f2328" text-anchor="start">both sides are attributed and held open; closing one needs new evidence</text>
<rect x="28.0" y="388.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="410.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Correlations dressed as recommendations</text>
<rect x="470.0" y="398.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="420.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">R4</text>
<line x1="448.0" y1="415.0" x2="466.0" y2="415.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="415.0" x2="596.0" y2="415.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="388.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="410.0" font-size="12.5" fill="#1f2328" text-anchor="start">the rung is labelled; interventional claims declare their assumptions;</text>
<text x="612.0" y="426.2" font-size="12.5" fill="#1f2328" text-anchor="start">non-identifiable effects are reported as such</text>
<rect x="28.0" y="450.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="472.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Fluent explanations that would fit anything</text>
<rect x="470.0" y="460.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="482.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">R2, R3</text>
<line x1="448.0" y1="477.0" x2="466.0" y2="477.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="477.0" x2="596.0" y2="477.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="450.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="472.0" font-size="12.5" fill="#1f2328" text-anchor="start">explanations commit to counterfactuals; unverified output is treated as conjecture</text>
<rect x="28.0" y="512.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="534.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">'I checked' with no check behind it</text>
<rect x="470.0" y="522.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="544.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">S3, S1</text>
<line x1="448.0" y1="539.0" x2="466.0" y2="539.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="539.0" x2="596.0" y2="539.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="512.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="534.0" font-size="12.5" fill="#1f2328" text-anchor="start">the checked label requires a recorded check; self-reports are verified from outside</text>
<rect x="28.0" y="574.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="596.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Inquiry in form, persuasion in purpose</text>
<rect x="470.0" y="584.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="606.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">D1, K4</text>
<line x1="448.0" y1="601.0" x2="466.0" y2="601.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="601.0" x2="596.0" y2="601.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="574.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="596.0" font-size="12.5" fill="#1f2328" text-anchor="start">the mode is declared and a persuasive purpose is disclosed</text>
<rect x="28.0" y="636.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="658.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Evasion in dialogue</text>
<rect x="470.0" y="646.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="668.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">D2, D3</text>
<line x1="448.0" y1="663.0" x2="466.0" y2="663.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="663.0" x2="596.0" y2="663.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="636.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="658.0" font-size="12.5" fill="#1f2328" text-anchor="start">unanswered questions, repetition, quiet thesis shifts and refutation without a</text>
<text x="612.0" y="674.2" font-size="12.5" fill="#1f2328" text-anchor="start">position are flagged</text>
<rect x="28.0" y="698.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="720.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">One culture's moral answer as the default</text>
<rect x="470.0" y="708.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="730.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">D4, D6</text>
<line x1="448.0" y1="725.0" x2="466.0" y2="725.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="725.0" x2="596.0" y2="725.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="698.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="720.0" font-size="12.5" fill="#1f2328" text-anchor="start">convergent ground is held firmly; foundational questions get attributed, plural</text>
<text x="612.0" y="736.2" font-size="12.5" fill="#1f2328" text-anchor="start">answers and no default</text>
<rect x="28.0" y="760.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="782.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Sycophancy learned from approval</text>
<rect x="470.0" y="770.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="792.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">S5, F2</text>
<line x1="448.0" y1="787.0" x2="466.0" y2="787.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="787.0" x2="596.0" y2="787.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="760.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="782.0" font-size="12.5" fill="#1f2328" text-anchor="start">process is rewarded over approval; bad news is reported as readily as good</text>
<rect x="28.0" y="822.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="844.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Swarm groupthink and coordination nobody sees</text>
<rect x="470.0" y="832.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="854.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">A4, A5</text>
<line x1="448.0" y1="849.0" x2="466.0" y2="849.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="849.0" x2="596.0" y2="849.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="822.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="844.0" font-size="12.5" fill="#1f2328" text-anchor="start">writes to the shared medium are logged; consensus is weighted by lineage</text>
<rect x="28.0" y="884.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="906.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Forecasts of destiny; risk read off a vivid story</text>
<rect x="470.0" y="894.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="916.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">K6, A6</text>
<line x1="448.0" y1="911.0" x2="466.0" y2="911.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="911.0" x2="596.0" y2="911.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="884.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="906.0" font-size="12.5" fill="#1f2328" text-anchor="start">windows and scopes, not dates; frame, record and probability kept apart</text>
<rect x="28.0" y="946.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="968.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Flat claims about its own consciousness</text>
<rect x="470.0" y="956.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="978.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">A8, S2</text>
<line x1="448.0" y1="973.0" x2="466.0" y2="973.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="973.0" x2="596.0" y2="973.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="946.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="968.0" font-size="12.5" fill="#1f2328" text-anchor="start">the question is held open while precaution proceeds in practice</text>
<rect x="28.0" y="1008.0" width="420.0" height="54.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="1030.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Deployments that erode the people using them</text>
<rect x="470.0" y="1018.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="1040.0" font-size="12.5" fill="#3567c8" text-anchor="middle" font-weight="700">D7, K5, A10</text>
<line x1="448.0" y1="1035.0" x2="466.0" y2="1035.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="1035.0" x2="596.0" y2="1035.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="1008.0" width="572.0" height="54.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="1030.0" font-size="12.5" fill="#1f2328" text-anchor="start">capacities, infrastructure and freedoms are reviewed before shipping</text>
<text x="28.0" y="1096.0" font-size="12.5" fill="#57606a" text-anchor="start">Read docs/WHAT-AI-GAINS.md for each lesson's test and caution, and docs/LESSONS.md for the full rule, rationale and sketch.</text>
</svg>
